name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le style (flake8)
        run: |
          pip install flake8
          flake8 --max-line-length=120 --exclude=migrations,venv .

      - name: Construire les fichiers statiques (collectstatic)
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
        run: python manage.py collectstatic --noinput

      - name: Lancer les tests
        env:
          SECRET_KEY: ci-test-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
          SECURE_SSL_REDIRECT: "False"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/taskmanager_test
        run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
